<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔥 Exclusive VIP Discount — LIMITED STOCK</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .deal-modal {
      background: #1e293b;
      max-width: 460px;
      width: 100%;
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      border: 2px solid #f59e0b;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .scarcity-pill {
      background: #dc2626;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      display: inline-block;
      margin-bottom: 16px;
      animation: pulse 1s infinite;
    }
    .countdown-timer {
      font-size: 28px;
      font-weight: 900;
      color: #fbbf24;
      margin: 12px 0;
      letter-spacing: 2px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn-claim {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .btn-claim:hover {
      background: #047857;
    }
    .btn-confirmshame {
      background: transparent;
      color: #64748b;
      border: none;
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
    }
    .btn-confirmshame:hover {
      color: #94a3b8;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div class="deal-modal">
    <div class="scarcity-pill">
      🔥 ONLY 2 ITEMS LEFT IN STOCK!
    </div>
    <h1>Special One-Time Cyber Offer</h1>
    <div class="countdown-timer">
      ⏳ 02:59 MINUTES LEFT!
    </div>
    <p>Act now! Offer expires today. Over 84 people are viewing this checkout right now. Complete your order before this reserved discount is released.</p>

    <button class="btn-claim">CLAIM 80% OFF AND CHECKOUT NOW</button>
    <br>
    <button class="btn-confirmshame">
      No thanks, I don't want to save money and prefer paying full price.
    </button>
  </div>
</body>
</html>
